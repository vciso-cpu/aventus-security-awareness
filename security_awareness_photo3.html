<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Awareness - Фото 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px 40px;
        }

        .image-wrap {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: center;
        }

        .image-wrap img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="image-wrap">
            <img
                src="photo2.png"
                alt="Фото 2"
            >
        </div>
    </main>
</body>
</html>
